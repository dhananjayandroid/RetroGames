<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon Says</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 32px;
            pointer-events: none;
        }

        #gameButtons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            /* Keep it square-ish */
        }

        .btn {
            width: 100%;
            height: 100%;
            border: none;
            cursor: pointer;
            border-radius: 20px;
            transition: transform 0.1s, opacity 0.1s;
            touch-action: manipulation;
        }

        .btn-red {
            background: #ff4444;
        }

        .btn-green {
            background: #44ff44;
        }

        .btn-blue {
            background: #4444ff;
        }

        .btn-yellow {
            background: #ffff44;
        }

        .btn:active,
        .btn.active {
            transform: scale(0.95);
            opacity: 1;
            filter: brightness(1.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Default opacity for non-active */
        .btn {
            opacity: 0.7;
        }

        #info {
            color: #fff;
            margin-top: 20px;
            font-size: 24px;
            min-height: 30px;
            font-weight: bold;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 24px;
            text-align: center;
            display: none;
            z-index: 10;
        }

        #startBtn {
            margin-top: 10px;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            background: #00aa00;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 0 #006600;
        }

        #startBtn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <h1>Simon Says</h1>

        <div id="gameButtons">
            <div class="btn btn-red" id="btn0"></div>
            <div class="btn btn-green" id="btn1"></div>
            <div class="btn btn-blue" id="btn2"></div>
            <div class="btn btn-yellow" id="btn3"></div>
        </div>

        <div id="info">Level: 0 | Score: 0</div>
        <button id="startBtn" onclick="game.start()">Start Game</button>

        <div id="message"></div>
    </div>

    <script>
        const game = {
            sequence: [],
            playerSequence: [],
            level: 0,
            score: 0,
            isPlaying: false,
            inputLocked: false,
            buttons: [
                document.getElementById('btn0'),
                document.getElementById('btn1'),
                document.getElementById('btn2'),
                document.getElementById('btn3')
            ],

            start() {
                this.sequence = [];
                this.playerSequence = [];
                this.level = 0;
                this.score = 0;
                this.isPlaying = true;
                this.updateInfo();
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('message').style.display = 'none';

                // Audio Context could be added here for sounds

                setTimeout(() => this.nextRound(), 500);
            },

            nextRound() {
                this.playerSequence = [];
                this.level++;
                this.score = (this.level - 1) * 10;
                this.updateInfo();
                this.addToSequence();
                this.playSequence();
            },

            addToSequence() {
                const randomColor = Math.floor(Math.random() * 4);
                this.sequence.push(randomColor);
            },

            playSequence() {
                this.inputLocked = true;
                let index = 0;

                const interval = setInterval(() => {
                    if (index < this.sequence.length) {
                        this.playColor(this.sequence[index]);
                        index++;
                    } else {
                        clearInterval(interval);
                        this.inputLocked = false;
                    }
                }, 800);
            },

            playColor(index) {
                const btn = this.buttons[index];
                btn.classList.add('active');
                setTimeout(() => {
                    btn.classList.remove('active');
                }, 400);
            },

            handleInput(index) {
                if (!this.isPlaying || this.inputLocked) return;

                // Visual Feedback
                this.playColor(index);
                this.playerSequence.push(index);

                // Check
                if (this.playerSequence[this.playerSequence.length - 1] !== this.sequence[this.playerSequence.length - 1]) {
                    this.gameOver();
                } else if (this.playerSequence.length === this.sequence.length) {
                    this.inputLocked = true;
                    // Score update for round complete?
                    this.score += 10;
                    setTimeout(() => this.nextRound(), 1000);
                }
                this.updateInfo();
            },

            gameOver() {
                this.isPlaying = false;
                const msg = document.getElementById('message');
                msg.style.display = 'block';
                msg.innerHTML = "Game Over!<br>Score: " + this.score + "<br><br>Tap to Restart";

                if (window.Android) window.Android.gameOver(this.score);

                // Allow restart by tapping message
                msg.onclick = () => {
                    this.start();
                };

                document.getElementById('startBtn').style.display = 'block';
            },

            updateInfo() {
                document.getElementById('info').textContent = 'Level: ' + this.level + ' | Score: ' + this.score;
            }
        };

        // Input Binding
        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById('btn' + i);
            const handler = (e) => {
                e.preventDefault();
                game.handleInput(i);
            };
            btn.addEventListener('touchstart', handler);
            btn.addEventListener('mousedown', handler);
        }

        window.revive = function () {
            game.start();
        };

        window.game = game;
    </script>
</body>

</html>
