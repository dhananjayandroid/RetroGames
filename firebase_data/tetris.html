<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #202028;
            overflow: hidden;
            font-family: monospace;
            touch-action: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #fff;
        }

        #game-container {
            flex: 1;
            position: relative;
            background: #202028;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
            pointer-events: none;
        }

        .stat-label {
            font-size: 14px;
            color: #aaa;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #startBtn {
            padding: 10px 30px;
            font-size: 20px;
            background: #0f0;
            color: #000;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }

        /* Controls Area */
        #controls-area {
            height: 220px;
            background: #111;
            border-top: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-shrink: 0;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }

        .d-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }

        .d-btn:active {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        #btn-up {
            grid-column: 2;
            grid-row: 1;
            border-radius: 10px 10px 0 0;
        }

        #btn-left {
            grid-column: 1;
            grid-row: 2;
            border-radius: 10px 0 0 10px;
        }

        #btn-right {
            grid-column: 3;
            grid-row: 2;
            border-radius: 0 10px 10px 0;
        }

        #btn-down {
            grid-column: 2;
            grid-row: 3;
            border-radius: 0 0 10px 10px;
        }

        .d-center {
            grid-column: 2;
            grid-row: 2;
            background: transparent;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="tetris"></canvas>

        <div id="ui">
            <div class="stat-label">SCORE</div>
            <div class="stat-value" id="score">0</div>
            <div class="stat-label">LINES</div>
            <div class="stat-value" id="lines">0</div>
        </div>

        <div id="msg">
            <h1>TETRIS</h1>
            <p>Use D-Pad to Play</p>
            <button id="startBtn" onclick="game.start()">Start</button>
        </div>
    </div>

    <div id="controls-area">
        <div class="d-pad">
            <div class="d-btn" id="btn-up">↻</div>
            <div class="d-btn" id="btn-left">◀</div>
            <div class="d-center"></div>
            <div class="d-btn" id="btn-right">▶</div>
            <div class="d-btn" id="btn-down">▼</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const linesEl = document.getElementById('lines');
        const msgEl = document.getElementById('msg');
        const gameContainer = document.getElementById('game-container');

        let scale = 20;
        const COLS = 10;
        const ROWS = 20;

        function resize() {
            const containerH = gameContainer.clientHeight;
            const containerW = gameContainer.clientWidth;

            let h = containerH - 20;
            let w = h * (COLS / ROWS);

            if (w > containerW - 20) {
                w = containerW - 20;
                h = w * (ROWS / COLS);
            }

            canvas.width = w;
            canvas.height = h;
            scale = w / COLS;
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 0);

        // Pieces and Colors
        const PIECES = 'ILJOTSZ';
        const COLORS = [
            null,
            '#FF0D72', '#0DC2FF', '#0DFF72',
            '#F538FF', '#FF8E0D', '#FFE138', '#3877FF',
        ];

        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
            else if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
            else if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
            else if (type === 'O') return [[4, 4], [4, 4]];
            else if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
            else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            else if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
        }

        const game = {
            board: [],
            player: null,
            score: 0,
            lines: 0,
            dropCounter: 0,
            dropInterval: 1000,
            lastTime: 0,
            isPlaying: false,

            start() {
                this.board = this.createMatrix(COLS, ROWS);
                this.score = 0;
                this.lines = 0;
                this.isPlaying = true;
                this.resetPlayer();
                this.updateScore();
                msgEl.style.display = 'none';
                this.lastTime = 0;
                this.dropCounter = 0;
                resize();
                requestAnimationFrame(this.update.bind(this));
            },

            createMatrix(w, h) {
                const matrix = [];
                while (h--) {
                    matrix.push(new Array(w).fill(0));
                }
                return matrix;
            },

            update(time = 0) {
                if (!this.isPlaying) return;

                const deltaTime = time - this.lastTime;
                this.lastTime = time;

                this.dropCounter += deltaTime;
                if (this.dropCounter > this.dropInterval) {
                    this.drop();
                }

                this.draw();
                requestAnimationFrame(this.update.bind(this));
            },

            draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                this.drawMatrix(this.board, { x: 0, y: 0 });
                this.drawMatrix(this.player.matrix, this.player.pos);
            },

            drawMatrix(matrix, offset) {
                matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            ctx.fillStyle = COLORS[value];
                            ctx.fillRect((x + offset.x) * scale, (y + offset.y) * scale, scale, scale);
                            ctx.lineWidth = 1;
                            ctx.strokeStyle = '#202028';
                            ctx.strokeRect((x + offset.x) * scale, (y + offset.y) * scale, scale, scale);
                        }
                    });
                });
            },

            merge(board, player) {
                player.matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            board[y + player.pos.y][x + player.pos.x] = value;
                        }
                    });
                });
            },

            rotate(dir = 1) {
                const pos = this.player.pos.x;
                let offset = 1;
                this._rotateMatrix(this.player.matrix, dir);
                while (this.collide(this.board, this.player)) {
                    this.player.pos.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (offset > this.player.matrix[0].length) {
                        this._rotateMatrix(this.player.matrix, -dir);
                        this.player.pos.x = pos;
                        return;
                    }
                }
            },

            _rotateMatrix(matrix, dir) {
                for (let y = 0; y < matrix.length; ++y) {
                    for (let x = 0; x < y; ++x) {
                        [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                    }
                }
                if (dir > 0) matrix.forEach(row => row.reverse());
                else matrix.reverse();
            },

            move(dir) {
                this.player.pos.x += dir;
                if (this.collide(this.board, this.player)) {
                    this.player.pos.x -= dir;
                }
            },

            drop() {
                this.player.pos.y++;
                if (this.collide(this.board, this.player)) {
                    this.player.pos.y--;
                    this.merge(this.board, this.player);
                    this.resetPlayer();
                    this.arenaSweep();
                    this.updateScore();
                }
                this.dropCounter = 0;
            },

            collide(board, player) {
                const [m, o] = [player.matrix, player.pos];
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < m[y].length; ++x) {
                        if (m[y][x] !== 0 && (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
                            return true;
                        }
                    }
                }
                return false;
            },

            resetPlayer() {
                const pieces = 'ILJOTSZ';
                this.player = {
                    pos: { x: COLS / 2 - 2, y: 0 },
                    matrix: createPiece(pieces[pieces.length * Math.random() | 0]),
                };
                if (this.collide(this.board, this.player)) {
                    this.gameOver();
                }
            },

            arenaSweep() {
                let rowCount = 1;
                outer: for (let y = this.board.length - 1; y > 0; --y) {
                    for (let x = 0; x < this.board[y].length; ++x) {
                        if (this.board[y][x] === 0) {
                            continue outer;
                        }
                    }
                    const row = this.board.splice(y, 1)[0].fill(0);
                    this.board.unshift(row);
                    ++y;

                    this.score += rowCount * 10;
                    this.lines += 1;
                    rowCount *= 2;
                }
            },

            updateScore() {
                scoreEl.innerText = this.score;
                linesEl.innerText = this.lines;
            },

            gameOver() {
                this.isPlaying = false;
                msgEl.style.display = 'flex';
                msgEl.innerHTML = "<h1>GAME OVER</h1><p>Score: " + this.score + "</p><button id='startBtn' onclick='game.start()'>Play Again</button>";
                if (window.Android) window.Android.gameOver(this.score);
            }
        };

        // D-Pad Inputs
        const buttons = {
            'btn-up': { action: () => game.rotate() },
            'btn-down': { action: () => game.drop() },
            'btn-left': { action: () => game.move(-1) },
            'btn-right': { action: () => game.move(1) }
        };

        Object.keys(buttons).forEach(id => {
            const btn = document.getElementById(id);
            const action = buttons[id].action;

            const handleInput = (e) => {
                e.preventDefault();
                if (game.isPlaying) action();
            };

            btn.addEventListener('touchstart', handleInput);
            btn.addEventListener('mousedown', handleInput);
        });

        document.addEventListener('keydown', event => {
            if (!game.isPlaying) return;
            if (event.keyCode === 37) game.move(-1);
            else if (event.keyCode === 39) game.move(1);
            else if (event.keyCode === 40) game.drop();
            else if (event.keyCode === 81 || event.keyCode === 38) game.rotate();
        });

        window.revive = function () {
            game.start();
        };

        game.board = game.createMatrix(COLS, ROWS);
        game.player = { pos: { x: 0, y: 0 }, matrix: [] };

    </script>
</body>

</html>
