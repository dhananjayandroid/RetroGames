<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hangman Game</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            color: #eee;
            touch-action: manipulation;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            color: #00d4ff;
            margin: 0 0 10px 0;
            font-size: 24px;
            text-align: center;
        }

        #top-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #hangman-drawing {
            font-size: 80px;
            height: 100px;
            margin-bottom: 20px;
        }

        #word-display {
            font-size: 30px;
            letter-spacing: 5px;
            margin: 20px 0;
            font-weight: bold;
            color: #00d4ff;
            word-break: break-all;
            text-align: center;
        }

        #guesses {
            margin: 10px 0;
            font-size: 16px;
        }

        #keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .letter-btn {
            aspect-ratio: 1;
            background: #0f3460;
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .letter-btn:active {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .letter-btn.guessed {
            background: #666;
            cursor: default;
            opacity: 0.5;
            border-color: #666;
        }

        #message {
            font-size: 18px;
            margin: 10px 0;
            min-height: 25px;
            text-align: center;
            font-weight: bold;
        }

        #result {
            font-size: 20px;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
            min-height: 25px;
        }

        #score {
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <h1>Hangman</h1>

        <div id="top-section">
            <div id="hangman-drawing">😊</div>
            <div id="word-display">_ _ _ _ _</div>
            <div id="guesses">Remaining: 6</div>
            <div id="message"></div>
            <div id="result"></div>
            <div id="score">Wins: 0 | Losses: 0</div>
        </div>

        <div id="keyboard"></div>
    </div>

    <script>
        const words = ['JAVASCRIPT', 'PROGRAMMING', 'HANGMAN', 'DEVELOPER', 'COMPUTER', 'FUNCTION', 'VARIABLE', 'DATABASE', 'NETWORK', 'SECURITY', 'MOBILE', 'ANDROID', 'CODING', 'INTERFACE'];
        const hangmanStages = ['😊', '😐', '😕', '😟', '😠', '😡', '😵'];

        let currentWord = '';
        let guessedLetters = [];
        let wrongGuesses = 0;
        let wins = 0;
        let losses = 0;
        let gameActive = false;

        function initGame() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            guessedLetters = [];
            wrongGuesses = 0;
            gameActive = true;

            document.getElementById('result').textContent = '';
            document.getElementById('message').textContent = 'Tap a letter!';
            document.getElementById('message').style.color = '#eee';

            updateDisplay();
            generateKeyboard();
        }

        function generateKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

            alphabet.forEach(letter => {
                const btn = document.createElement('div');
                btn.textContent = letter;
                btn.className = 'letter-btn';
                // Touch and Click support
                btn.onclick = () => guessLetter(letter, btn);
                keyboard.appendChild(btn);
            });
        }

        function guessLetter(letter, btn) {
            if (!gameActive || guessedLetters.includes(letter)) return;

            guessedLetters.push(letter);
            btn.classList.add('guessed');

            if (!currentWord.includes(letter)) {
                wrongGuesses++;
                document.getElementById('message').textContent = 'Wrong!';
                document.getElementById('message').style.color = '#ff4444';
            } else {
                document.getElementById('message').textContent = 'Correct!';
                document.getElementById('message').style.color = '#44ff44';
            }

            updateDisplay();
            checkGameEnd();
        }

        function updateDisplay() {
            const wordDisplay = document.getElementById('word-display');
            const display = currentWord.split('').map(letter =>
                guessedLetters.includes(letter) ? letter : '_'
            ).join(' ');

            wordDisplay.textContent = display;
            document.getElementById('hangman-drawing').textContent = hangmanStages[wrongGuesses];
            document.getElementById('guesses').textContent = 'Remaining: ' + (6 - wrongGuesses);
            document.getElementById('score').textContent = 'Wins: ' + wins + ' | Losses: ' + losses;
        }

        function checkGameEnd() {
            // Win
            if (currentWord.split('').every(letter => guessedLetters.includes(letter))) {
                gameEnd(true);
            }
            // Lose
            else if (wrongGuesses >= 6) {
                gameEnd(false);
            }
        }

        function gameEnd(won) {
            gameActive = false;
            if (won) {
                wins++;
                document.getElementById('result').textContent = 'You Won! 🎉';
                document.getElementById('result').style.color = '#44ff44';
                if (window.Android) window.Android.gameOver(wins * 10); // Example score calculation
            } else {
                losses++;
                document.getElementById('result').textContent = 'Word: ' + currentWord;
                document.getElementById('result').style.color = '#ff4444';
                if (window.Android) window.Android.gameOver(wins * 10);
            }
            disableAllButtons();

            // Auto restart after delay? Or wait for Revive?
            // Let's autoshow a restart text or wait
            // Existing logic had timeout. Let's keep timeout for simple loop unless Android intervention
            setTimeout(() => {
                if (!window.Android) initGame();
            }, 3000);
        }

        function disableAllButtons() {
            document.querySelectorAll('.letter-btn').forEach(btn => {
                btn.classList.add('guessed');
            });
        }

        // Global Revive
        window.revive = function () {
            initGame();
        };

        window.onload = initGame;
    </script>
</body>

</html>
