<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asteroids</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: monospace;
            touch-action: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #fff;
        }

        #game-container {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: #000;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            pointer-events: none;
        }

        #score {
            font-size: 20px;
        }

        #msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        /* Controls Area */
        #controls-area {
            height: 220px;
            background: #111;
            border-top: 2px solid #333;
            display: flex;
            justify-content: center;
            /* Centered D-Pad */
            align-items: center;
            padding: 20px;
            flex-shrink: 0;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 5px;
        }

        .d-btn {
            background: #222;
            border: 2px solid #555;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #aaa;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }

        .d-btn:active,
        .d-btn.active {
            background: #444;
            color: #fff;
            border-color: #fff;
        }

        /* Layout */
        #btn-thrust {
            grid-column: 2;
            grid-row: 1;
            border-radius: 10px 10px 0 0;
        }

        #btn-left {
            grid-column: 1;
            grid-row: 2;
            border-radius: 10px 0 0 10px;
        }

        #btn-right {
            grid-column: 3;
            grid-row: 2;
            border-radius: 0 10px 10px 0;
        }

        /* Shoot is center */
        #btn-shoot {
            grid-column: 2;
            grid-row: 2;
            background: #500;
            border: 2px solid #f00;
            border-radius: 50%;
            color: #f00;
            font-weight: bold;
            font-size: 14px;
        }

        #btn-shoot:active {
            background: #f00;
            color: #fff;
        }

        .spacer {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="lives">Lives: 3</div>
        </div>

        <div id="msg">
            <h1>ASTEROIDS</h1>
            <p>Arrow Up: Thrust</p>
            <p>Left/Right: Rotate</p>
            <p>Center: Shoot</p>
            <h2 style="color:#0f0">Tap D-Pad to Start</h2>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="controls-area">
        <div class="d-pad">
            <div class="spacer"></div>
            <div class="d-btn" id="btn-thrust">▲</div>
            <div class="spacer"></div>

            <div class="d-btn" id="btn-left">◀</div>
            <div class="d-btn" id="btn-shoot">FIRE</div>
            <div class="d-btn" id="btn-right">▶</div>

            <div class="spacer"></div>
            <div class="spacer"></div>
            <div class="spacer"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const msgEl = document.getElementById('msg');
        const gameContainer = document.getElementById('game-container');

        // Resize
        let width, height;
        function resize() {
            width = gameContainer.clientWidth;
            height = gameContainer.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 0);

        // Game Objects
        const ship = {
            x: 0, y: 0, a: 0,
            r: 10,
            xv: 0, yv: 0,
            thrusting: false,
            rot: 0,
            blinkNum: 0,
            blinkTime: 0,
            canShoot: true,
            lasers: [],
            dead: false
        };

        const FPS = 60;
        const FRICTION = 0.7;
        const SHIP_THRUST = 5;
        const TURN_SPEED = 360;
        const LASER_MAX = 10;
        const LASER_SPD = 500;
        const LASER_DIST = 0.6;
        const ROIDS_NUM = 3;
        const ROIDS_SIZE = 100;
        const ROIDS_SPD = 50;
        const ROIDS_VERT = 10;

        let roids = [];
        let score = 0;
        let lives = 3;
        let level = 0;
        let textAlpha = 0;

        const input = {
            thrust: false,
            left: false,
            right: false,
            shoot: false
        };

        const STATE = { READY: 0, PLAYING: 1, OVER: 2 };
        let currentState = STATE.READY;

        function newAsteroid(x, y, r) {
            const lvlMult = 1 + 0.1 * level;
            const roid = {
                x: x, y: y,
                xv: Math.random() * ROIDS_SPD * lvlMult / FPS * (Math.random() < 0.5 ? 1 : -1),
                yv: Math.random() * ROIDS_SPD * lvlMult / FPS * (Math.random() < 0.5 ? 1 : -1),
                r: r,
                a: Math.random() * Math.PI * 2,
                vert: Math.floor(Math.random() * (ROIDS_VERT + 1) + ROIDS_VERT / 2),
                offs: []
            };
            for (let i = 0; i < roid.vert; i++) {
                roid.offs.push(Math.random() * 0.4 + 0.8);
            }
            return roid;
        }

        function createAsteroidBelt() {
            roids = [];
            let x, y;
            for (let i = 0; i < ROIDS_NUM + level; i++) {
                do {
                    x = Math.floor(Math.random() * width);
                    y = Math.floor(Math.random() * height);
                } while (distBetweenPoints(ship.x, ship.y, x, y) < ROIDS_SIZE * 2 + ship.r);
                roids.push(newAsteroid(x, y, Math.ceil(ROIDS_SIZE / 2)));
            }
        }

        function distBetweenPoints(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        function shootLaser() {
            if (ship.canShoot && ship.lasers.length < LASER_MAX) {
                ship.lasers.push({
                    x: ship.x + 4 / 3 * ship.r * Math.cos(ship.a),
                    y: ship.y - 4 / 3 * ship.r * Math.sin(ship.a),
                    xv: LASER_SPD * Math.cos(ship.a) / FPS,
                    yv: -LASER_SPD * Math.sin(ship.a) / FPS,
                    dist: 0
                });
            }
            ship.canShoot = false;
        }

        function init() {
            ship.x = width / 2;
            ship.y = height / 2;
            ship.a = 90 / 180 * Math.PI;
            createAsteroidBelt();

            currentState = STATE.READY;
            msgEl.style.display = 'block';
        }

        function startGame() {
            ship.dead = false;
            lives = 3;
            score = 0;
            level = 0;
            init();
            createAsteroidBelt();

            currentState = STATE.PLAYING;
            msgEl.style.display = 'none';

            livesEl.innerText = "Lives: " + lives;
            scoreEl.innerText = "Score: " + score;
        }

        function explodeShip() {
            ship.dead = true;
            lives--;
            livesEl.innerText = "Lives: " + lives;

            if (lives > 0) {
                setTimeout(() => {
                    ship.dead = false;
                    ship.x = width / 2;
                    ship.y = height / 2;
                    ship.xv = 0;
                    ship.yv = 0;
                }, 2000);
            } else {
                gameOver();
            }
        }

        function gameOver() {
            currentState = STATE.OVER;
            msgEl.innerHTML = "<h1>GAME OVER</h1><p>Score: " + score + "</p><h2>Tap FIRE to Restart</h2>";
            msgEl.style.display = 'block';
            if (window.Android) window.Android.gameOver(score);
        }

        function update() {
            if (!width) return;

            if (currentState === STATE.READY && input.shoot) {
                startGame();
                input.shoot = false;
            }

            if (currentState === STATE.OVER && input.shoot) {
                startGame();
                input.shoot = false;
            }

            if (currentState === STATE.PLAYING && !ship.dead) {
                if (input.thrust) {
                    ship.thrusting = true;
                    ship.xv += SHIP_THRUST * Math.cos(ship.a) / FPS;
                    ship.yv -= SHIP_THRUST * Math.sin(ship.a) / FPS;
                } else {
                    ship.thrusting = false;
                    ship.xv -= FRICTION * ship.xv / FPS;
                    ship.yv -= FRICTION * ship.yv / FPS;
                }

                if (input.left) {
                    ship.a += TURN_SPEED / 180 * Math.PI / FPS;
                }
                if (input.right) {
                    ship.a -= TURN_SPEED / 180 * Math.PI / FPS;
                }

                ship.x += ship.xv;
                ship.y += ship.yv;

                if (ship.x < 0 - ship.r) ship.x = width + ship.r;
                else if (ship.x > width + ship.r) ship.x = 0 - ship.r;
                if (ship.y < 0 - ship.r) ship.y = height + ship.r;
                else if (ship.y > height + ship.r) ship.y = 0 - ship.r;

                if (input.shoot) shootLaser();
            }

            for (let i = ship.lasers.length - 1; i >= 0; i--) {
                ship.lasers[i].x += ship.lasers[i].xv;
                ship.lasers[i].y += ship.lasers[i].yv;
                ship.lasers[i].dist += Math.sqrt(Math.pow(ship.lasers[i].xv, 2) + Math.pow(ship.lasers[i].yv, 2));

                if (ship.lasers[i].x < 0) ship.lasers[i].x = width;
                else if (ship.lasers[i].x > width) ship.lasers[i].x = 0;
                if (ship.lasers[i].y < 0) ship.lasers[i].y = height;
                else if (ship.lasers[i].y > height) ship.lasers[i].y = 0;

                if (ship.lasers[i].dist > width * LASER_DIST) {
                    ship.lasers.splice(i, 1);
                    continue;
                }
            }

            for (let i = 0; i < roids.length; i++) {
                roids[i].x += roids[i].xv;
                roids[i].y += roids[i].yv;

                if (roids[i].x < 0 - roids[i].r) roids[i].x = width + roids[i].r;
                else if (roids[i].x > width + roids[i].r) roids[i].x = 0 - roids[i].r;
                if (roids[i].y < 0 - roids[i].r) roids[i].y = height + roids[i].r;
                else if (roids[i].y > height + roids[i].r) roids[i].y = 0 - roids[i].r;
            }

            for (let i = roids.length - 1; i >= 0; i--) {
                let ax = roids[i].x, ay = roids[i].y, ar = roids[i].r;
                for (let j = ship.lasers.length - 1; j >= 0; j--) {
                    let lx = ship.lasers[j].x, ly = ship.lasers[j].y;
                    if (distBetweenPoints(ax, ay, lx, ly) < ar) {
                        ship.lasers.splice(j, 1);
                        roids.splice(i, 1);
                        score += 10;
                        scoreEl.innerText = "Score: " + score;
                        if (ar > Math.ceil(ROIDS_SIZE / 4)) {
                            roids.push(newAsteroid(ax, ay, Math.ceil(ar / 2)));
                            roids.push(newAsteroid(ax, ay, Math.ceil(ar / 2)));
                        }
                        if (roids.length === 0) {
                            level++;
                            createAsteroidBelt();
                        }
                        break;
                    }
                }
            }

            if (!ship.dead && currentState === STATE.PLAYING) {
                for (let i = 0; i < roids.length; i++) {
                    if (distBetweenPoints(ship.x, ship.y, roids[i].x, roids[i].y) < ship.r + roids[i].r) {
                        explodeShip();
                        break;
                    }
                }
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, width, height);
            if (!width) return;

            if (!ship.dead) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = ROIDS_SIZE / 20;
                ctx.beginPath();
                ctx.moveTo(
                    ship.x + 4 / 3 * ship.r * Math.cos(ship.a),
                    ship.y - 4 / 3 * ship.r * Math.sin(ship.a)
                );
                ctx.lineTo(
                    ship.x - ship.r * (2 / 3 * Math.cos(ship.a) + Math.sin(ship.a)),
                    ship.y + ship.r * (2 / 3 * Math.sin(ship.a) - Math.cos(ship.a))
                );
                ctx.lineTo(
                    ship.x - ship.r * (2 / 3 * Math.cos(ship.a) - Math.sin(ship.a)),
                    ship.y + ship.r * (2 / 3 * Math.sin(ship.a) + Math.cos(ship.a))
                );
                ctx.closePath();
                ctx.stroke();
            }

            ctx.fillStyle = "salmon";
            for (let i = 0; i < ship.lasers.length; i++) {
                ctx.beginPath();
                ctx.arc(ship.lasers[i].x, ship.lasers[i].y, ROIDS_SIZE / 15, 0, Math.PI * 2, false);
                ctx.fill();
            }

            ctx.strokeStyle = "slategrey";
            ctx.lineWidth = ROIDS_SIZE / 20;
            for (let i = 0; i < roids.length; i++) {
                const a = roids[i].a;
                const r = roids[i].r;
                const x = roids[i].x;
                const y = roids[i].y;
                const offs = roids[i].offs;
                const vert = roids[i].vert;

                ctx.beginPath();
                for (let j = 0; j < vert; j++) {
                    ctx.lineTo(
                        x + r * offs[j] * Math.cos(a + j * Math.PI * 2 / vert),
                        y + r * offs[j] * Math.sin(a + j * Math.PI * 2 / vert)
                    );
                }
                ctx.closePath();
                ctx.stroke();
            }
        }

        function setupBtn(id, key) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); input[key] = true; btn.classList.add('active'); };
            const end = (e) => { e.preventDefault(); input[key] = false; if (key === 'shoot') ship.canShoot = true; btn.classList.remove('active'); };

            btn.addEventListener('touchstart', start);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        setupBtn('btn-thrust', 'thrust');
        setupBtn('btn-left', 'left');
        setupBtn('btn-right', 'right');
        setupBtn('btn-shoot', 'shoot');

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') input.thrust = true;
            if (e.key === 'ArrowLeft') input.left = true;
            if (e.key === 'ArrowRight') input.right = true;
            if (e.key === ' ' || e.key === 'Enter') input.shoot = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') input.thrust = false;
            if (e.key === 'ArrowLeft') input.left = false;
            if (e.key === 'ArrowRight') input.right = false;
            if (e.key === ' ' || e.key === 'Enter') { input.shoot = false; ship.canShoot = true; }
        });

        setInterval(update, 1000 / FPS);
        init();

        window.revive = function () {
            startGame();
        };

    </script>
</body>

</html>
