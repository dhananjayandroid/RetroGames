<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: monospace;
            touch-action: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #game-container {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: #000;
            border: 2px solid #333;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            pointer-events: none;
        }

        #score {
            font-size: 24px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }

        #msg {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            font-size: 24px;
            color: #0f0;
            display: none;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 0;
            pointer-events: none;
        }

        /* Controls Area */
        #controls-area {
            height: 220px;
            background: #111;
            border-top: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-shrink: 0;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }

        .d-btn {
            background: #222;
            border: 2px solid #0f0;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #0f0;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            transition: all 0.1s;
        }

        .d-btn:active {
            background: #0f0;
            color: #000;
            transform: scale(0.95);
        }

        #btn-up {
            grid-column: 2;
            grid-row: 1;
            border-radius: 10px 10px 0 0;
        }

        #btn-left {
            grid-column: 1;
            grid-row: 2;
            border-radius: 10px 0 0 10px;
        }

        #btn-right {
            grid-column: 3;
            grid-row: 2;
            border-radius: 0 10px 10px 0;
        }

        #btn-down {
            grid-column: 2;
            grid-row: 3;
            border-radius: 0 0 10px 10px;
        }

        .d-center {
            grid-column: 2;
            grid-row: 2;
            background: #111;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <div id="ui">
            <div id="score">Score: 0</div>
        </div>
        <div id="msg">Tap D-Pad to Start</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="controls-area">
        <div class="d-pad">
            <div class="d-btn" id="btn-up">▲</div>
            <div class="d-btn" id="btn-left">◀</div>
            <div class="d-center"></div>
            <div class="d-btn" id="btn-right">▶</div>
            <div class="d-btn" id="btn-down">▼</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const msgEl = document.getElementById('msg');
        const gameContainer = document.getElementById('game-container');

        let width, height, cellSize;
        const GRID_W = 20;
        let GRID_H = 20;

        function resize() {
            const containerW = gameContainer.clientWidth;
            const containerH = gameContainer.clientHeight;

            width = containerW;
            height = containerH;
            canvas.width = width;
            canvas.height = height;

            cellSize = width / GRID_W;
            GRID_H = Math.floor(height / cellSize);
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 0);

        // Game State
        const STATE = { READY: 0, PLAYING: 1, OVER: 2 };
        let currentState = STATE.READY;

        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;

        function init() {
            currentState = STATE.READY;
            msgEl.style.display = 'block';
            msgEl.innerText = "Tap Directions\nto Start";
            score = 0;
            scoreEl.innerText = 'Score: 0';

            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            resize(); // Update grid H
            placeFood();
            draw();
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_W);
                food.y = Math.floor(Math.random() * GRID_H);

                valid = true;
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function startGame(dx, dy) {
            if (currentState === STATE.OVER) {
                init();
                return;
            }

            if (currentState === STATE.READY) {
                currentState = STATE.PLAYING;
                msgEl.style.display = 'none';
            }

            if (dx !== undefined && dy !== undefined) {
                // Prevent reverse direction
                if (dx !== 0 && direction.x === 0) nextDirection = { x: dx, y: 0 };
                if (dy !== 0 && direction.y === 0) nextDirection = { x: 0, y: dy };
            }
        }

        function update() {
            if (currentState !== STATE.PLAYING) return;

            if ((nextDirection.x !== 0 && direction.x === 0) ||
                (nextDirection.y !== 0 && direction.y === 0)) {
                direction = nextDirection;
            }

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Collision Walls
            if (head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H) {
                gameOver();
                return;
            }

            // Collision Self
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Eat Food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = 'Score: ' + score;
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(food.x * cellSize + 1, food.y * cellSize + 1, cellSize - 2, cellSize - 2);

            ctx.fillStyle = '#00ff00';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * cellSize + 1, segment.y * cellSize + 1, cellSize - 2, cellSize - 2);
            });
        }

        function gameOver() {
            currentState = STATE.OVER;
            msgEl.style.display = 'block';
            msgEl.innerText = "GAME OVER\nTap D-Pad to Restart";
            if (window.Android) window.Android.gameOver(score);
        }

        // D-Pad Inputs
        const buttons = {
            'btn-up': { x: 0, y: -1 },
            'btn-down': { x: 0, y: 1 },
            'btn-left': { x: -1, y: 0 },
            'btn-right': { x: 1, y: 0 }
        };

        Object.keys(buttons).forEach(id => {
            const btn = document.getElementById(id);
            const dir = buttons[id];

            const handleInput = (e) => {
                e.preventDefault();
                startGame(dir.x, dir.y);
            };

            btn.addEventListener('touchstart', handleInput);
            btn.addEventListener('mousedown', handleInput);
        });

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') startGame(0, -1);
            if (e.key === 'ArrowDown') startGame(0, 1);
            if (e.key === 'ArrowLeft') startGame(-1, 0);
            if (e.key === 'ArrowRight') startGame(1, 0);
        });

        window.revive = function () {
            init();
        };

        setInterval(update, 100);
        init();
    </script>
</body>

</html>
